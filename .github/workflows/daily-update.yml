name: Daily IPO Data Update

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at 00:00 UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Update Script
      run: python scripts/update_ipo_data.py
      env:
        # API_KEY: ${{ secrets.IPO_API_KEY }} # Add secrets later if needed

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add js/data.js
        git commit -m "chore: Daily IPO data update at $(date -u +'%Y-%m-%d %H:%M:%S') UTC" || exit 0
        git push origin main
        # Also update gh-pages if it exists
        git checkout gh-pages && git merge main && git push origin gh-pages || echo "gh-pages update skipped"
        git checkout main
